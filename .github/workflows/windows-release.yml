name: Build release installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install TECLA, PyInstaller and the spaCy models
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller
          python -m spacy download es_core_news_md
          python -m spacy download en_core_web_lg

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build application and installer
        shell: cmd
        run: packaging\windows\build_windows.bat

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TECLA-Windows
          path: |
            dist/TECLA-*-setup.exe
            dist/TECLA-windows.zip
          if-no-files-found: error

  build-macos:
    # Apple silicon runner: the disk image only runs on M1 or later
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install TECLA, PyInstaller and the spaCy models
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller
          python -m spacy download es_core_news_md
          python -m spacy download en_core_web_lg

      - name: Build application and disk image
        run: ./scripts/build_macos_app.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TECLA-macOS
          path: dist/TECLA-*-macos-*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
