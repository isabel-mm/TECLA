[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tecla"
version = "2.2.0"
description = "TECLA: Term Extraction and Corpus Linguistics Application"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "pdfminer.six",
    "spacy>=3.0",
    "nltk",
    "langid",
    "pandas",
    "tqdm",
    "numpy",
    "pyyaml",
    "matplotlib",
    "customtkinter",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
tecla = "tecla.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tecla*", "pipeline*"]
